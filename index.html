<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Anggota Kelompok</title>
    <style>
        /* Desain untuk tombol */
        .tombol-anggota {
            display: inline-block;
            padding: 12px 24px;
            margin: 5px;
            background-color: #2563eb; /* Warna biru */
            color: white;
            text-decoration: none; /* Menghilangkan garis bawah link */
            border-radius: 8px; /* Membuat sudut melengkung */
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        /* Efek warna saat kursor diarahkan ke tombol */
        .tombol-anggota:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h2>Website Anggota Kelompok</h2>

    <!-- Tombol menuju web anggota lain (sesama file HTML dalam 1 folder) -->
    <a href="anggota1.html" class="tombol-anggota">Profil Anggota 1</a>

    <!-- Tombol menuju link website eksternal (misal GitHub Pages / Vercel) -->
    <a href="https://github.io" target="_blank" class="tombol-anggota">Web Anggota 2</a>

</body>
</html
